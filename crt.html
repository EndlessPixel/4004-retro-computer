<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Intel 4004 - CRT Terminal</title>
<style>
  * { box-sizing:border-box; }
  html,body {
    margin:0; height:100%; background:#080808; overflow:hidden;
    font-family:"Courier New",Courier,monospace; user-select:none;
  }
  .case {
    position:absolute; inset:2.5vmin; padding:2.4vmin;
    border-radius:5vmin;
    background:linear-gradient(150deg,#3a3934 0%,#1c1b18 45%,#0d0d0c 100%);
    box-shadow:inset 0 0 2vmin rgba(255,255,255,.06),
               inset 0 -1vmin 3vmin rgba(0,0,0,.85), 0 0 5vmin #000;
  }
  .label {
    position:absolute; left:3.5vmin; bottom:.5vmin;
    font-size:1.25vmin; letter-spacing:.28em; color:#777166; text-transform:uppercase;
  }
  #sound-status {
    position:absolute; right:3.5vmin; bottom:.5vmin;
    font-size:1.2vmin; letter-spacing:.1em; color:#6bbf7a; white-space:pre;
  }
  .screen {
    position:relative; width:100%; height:100%; overflow:hidden; cursor:text;
    border-radius:3.6vmin;
    background:#010301;
    box-shadow:inset 0 0 5vmin rgba(0,0,0,.95), inset 0 0 1vmin rgba(80,255,130,.10);
    animation:boot .9s ease-out;
  }
  /* 玻璃反光和暗角，纯粹的视觉外壳 */
  .screen::after {
    content:""; position:absolute; inset:0; z-index:5; pointer-events:none;
    background:radial-gradient(ellipse at 28% 16%,rgba(190,255,210,.07),transparent 48%),
               radial-gradient(ellipse at 50% 50%,transparent 55%,rgba(0,0,0,.45) 100%);
  }
  #screen-canvas {
    position:absolute; inset:3vmin 3.5vmin; z-index:2;
    width:calc(100% - 7vmin); height:calc(100% - 6vmin);
    image-rendering:pixelated; image-rendering:crisp-edges;
    filter:drop-shadow(0 0 .3vmin rgba(90,255,130,.5)) blur(.02vmin);
  }
  @keyframes boot {
    0%   { transform:scaleY(.004); filter:brightness(4); }
    35%  { transform:scaleY(.004); filter:brightness(3); }
    100% { transform:scaleY(1);    filter:brightness(1); }
  }
</style>
</head>
<body>
<div class="case">
  <div class="screen">
    <canvas id="screen-canvas" width="640" height="200" tabindex="0"></canvas>
  </div>
  <div class="label">intel 4004 · terminal</div>
  <div id="sound-status">SND: 8bit 8kHz --</div>
</div>
<script>
  const canvas = document.getElementById('screen-canvas');
  const ctx = canvas.getContext('2d', { alpha:false });

  let W = 640, H = 200, STRIDE = 80;
  let target = new Uint8Array(STRIDE * H);   // 后端推来的目标像素
  let phosphor = new Float32Array(W * H);     // 每个磷光点的亮度，随时间衰减
  let beam = 0;                               // 电子束当前像素位置

  // 电子束速度：每帧轰击的像素数。一整屏 128000 点，约 40 帧扫完
  const BEAM_SPEED = 3200;
  // 磷光余辉：每帧衰减系数，越小余辉越短、扫描束越明显
  const DECAY = 0.978;

  const img = ctx.createImageData(W, H);
  const data = img.data;

  function resize(w, h) {
    W = w; H = h; STRIDE = w / 8;
    canvas.width = W; canvas.height = H;
    phosphor = new Float32Array(W * H);
    target = new Uint8Array(STRIDE * H);
    beam = 0;
  }

  function onTarget(x, y) {
    return (target[y * STRIDE + (x >> 3)] & (0x80 >> (x & 7))) !== 0;
  }

  function frame() {
    // 余辉衰减：所有磷光点亮度按指数衰减
    for (let i = 0; i < phosphor.length; i++) phosphor[i] *= DECAY;

    // 电子束按光栅从左到右、从上到下逐点轰击
    for (let n = 0; n < BEAM_SPEED; n++) {
      const x = beam % W;
      const y = (beam / W) | 0;
      // 目标点亮则充到最亮；否则该点本帧不被轰击
      if (onTarget(x, y)) phosphor[beam] = 1.0;
      beam = (beam + 1) % phosphor.length;
    }

    // 磷光亮度 -> 像素颜色
    for (let i = 0, o = 0; i < phosphor.length; i++, o += 4) {
      const v = phosphor[i];
      data[o]     = 3 + (v * 136) | 0;
      data[o + 1] = 10 + (v * 245) | 0;
      data[o + 2] = 6 + (v * 158) | 0;
      data[o + 3] = 255;
    }

    // 电子束落点：一个高亮白点，是"正在轰击"的位置
    const bx = beam % W, by = (beam / W) | 0;
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        const x = bx + dx, y = by + dy;
        if (x < 0 || x >= W || y < 0 || y >= H) continue;
        const o = (y * W + x) * 4;
        data[o] = 200; data[o + 1] = 255; data[o + 2] = 210;
      }
    }

    ctx.putImageData(img, 0, 0);
    requestAnimationFrame(frame);
  }

  // 声卡：Web Audio 播放 8-bit unsigned PCM，并在机壳上显示硬件状态
  const soundStatus = document.getElementById('sound-status');
  let audioCtx = null;
  function playPcm(pcm, rate) {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const bytes = Uint8Array.from(atob(pcm), c => c.charCodeAt(0));
      const buf = audioCtx.createBuffer(1, bytes.length, rate);
      const ch = buf.getChannelData(0);
      for (let i = 0; i < bytes.length; i++) ch[i] = (bytes[i] - 128) / 128;
      const src = audioCtx.createBufferSource();
      src.buffer = buf;
      src.connect(audioCtx.destination);
      src.start();
    } catch (err) { console.error(err); }
  }
  const soundSource = new EventSource('/sound');
  soundSource.onmessage = (e) => {
    try {
      const s = JSON.parse(e.data);
      playPcm(s.pcm, s.rate);
    } catch (err) { console.error(err); }
  };

  const source = new EventSource('/events');
  source.onmessage = (e) => {
    try {
      const f = JSON.parse(e.data);
      if (f.width !== W || f.height !== H) resize(f.width, f.height);
      target = Uint8Array.from(atob(f.pixels), c => c.charCodeAt(0));
      if (f.sound) {
        const s = f.sound;
        soundStatus.textContent = `SND: ${s.bits}bit ${s.rate}Hz vol${s.volume} ` +
          `${s.enabled ? s.lastFreq + 'Hz' : 'OFF'} plays${s.plays}`;
      }
    } catch (err) { console.error(err); }
  };

  const special = {
    Enter:'Enter', Backspace:'Backspace', Delete:'Delete',
    ArrowUp:'ArrowUp', ArrowDown:'ArrowDown', ArrowLeft:'ArrowLeft', ArrowRight:'ArrowRight',
    Home:'Home', End:'End', Tab:'Tab', Escape:'Escape', F10:'F10'
  };
  // 让页面拿到键盘焦点，否则 IDE 内嵌浏览器里按键会被外层拦截
  canvas.focus();
  canvas.addEventListener('click', () => {
    canvas.focus();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  });

  document.addEventListener('keydown', (e) => {
    // Ctrl+Shift+V：从剪贴板粘贴，整段发给后端逐字符处理
    if (e.ctrlKey && e.shiftKey && (e.code === 'KeyV' || e.key.toLowerCase() === 'v')) {
      e.preventDefault();
      e.stopPropagation();
      navigator.clipboard.readText().then(text => {
        if (text) fetch('/paste', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ text })
        });
      }).catch(err => console.error('paste failed', err));
      return;
    }
    let key = null;
    if (e.ctrlKey) {
      // 用 code 而非 key：Ctrl 组合下 key 可能是控制字符（如 Ctrl+X 的 \x18）
      const m = /^Key([A-Z])$/.exec(e.code);
      if (m) key = 'Ctrl+' + m[1];
      else if (e.key.length === 1 && /[a-zA-Z]/.test(e.key)) key = 'Ctrl+' + e.key.toUpperCase();
    } else {
      key = special[e.key] || (e.key.length === 1 && !e.metaKey ? e.key : null);
    }
    if (key) {
      fetch('/key', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body:JSON.stringify({key})
      });
      // Ctrl 组合键尤其要阻止默认行为（Ctrl+X 会被当剪切、Ctrl+W 会关标签页）
      e.preventDefault();
      e.stopPropagation();
    }
  }, true);

  requestAnimationFrame(frame);
</script>
</body>
</html>
